# Flat Ultralytics train-arg overrides of ultralytics/cfg/default.yaml.
# Keys not listed here fall back to Ultralytics' own defaults. `data`,
# `project` and `name` are filled in / resolved by src/yolo/trainer.py; don't
# set them here.
model: yolo26m-seg.pt # medium: comparable in size to EoMT-small, the model it's compared with
epochs: 100
patience: 15
imgsz: 1920 # native long side (1920x1088 frames): loaded without downscale; val also runs at this size
batch: 128 # fixed total batch, split across GPUs under DDP; -1 = AutoBatch (60% of GPU memory), a float in (0, 1) sets the fraction
seed: 42
deterministic: true
workers: 6
device: auto
plots: true
# No crop_size: the stock trainer, whole frame letterboxed to imgsz. crop_size: 640 trains on
# random 640x640 crops of the native frame instead (see src/yolo/trainer.py).
