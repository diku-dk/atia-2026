# Ultralytics `cfg=` file: train-arg overrides of ultralytics/cfg/default.yaml, used as
#   yolo segment train cfg=src/yolo/configs/seg.yaml data=data/seed<N>/data.yaml project=<absolute dir> name=train
# (src/experiments.py builds the same command). Keys not listed here keep Ultralytics' defaults; `data`,
# `project` and `name` are passed per run (a relative `project` lands under Ultralytics' runs_dir setting).
model: yolo26m-seg.pt # medium: comparable in size to EoMT-small, the model it's compared with
epochs: 100
patience: 15
imgsz: 1920 # native long side (1920x1088 frames): loaded without downscale; val also runs at this size
batch: 128 # fixed total batch, split across GPUs under DDP; -1 = AutoBatch (single GPU only)
seed: 42
deterministic: true
workers: 6
device: auto
plots: true
